name: Feature Request
description: Suggest a new feature or improvement for PersonalBeacon
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for PersonalBeacon? Share it here!

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added or changed?
      placeholder: Describe your idea clearly...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: Explain the problem this feature would solve or the experience it would improve.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds or other approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any mockups, screenshots, or references that help illustrate your idea.
    validations:
      required: false
